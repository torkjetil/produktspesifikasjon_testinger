# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:nasjonal-database-for-grunnunders-kelser-nadag-uml-modell:1.0.0
version: 1.0.0
status: active
name: Nasjonal database for grunnundersøkelser (NADAG) - uml modell
schema:
- name: Trykksondering
  physicalName: trykksondering
  logicalType: object
  physicalType: table
  description: penetrasjon av en trykksonde på enden av en serie med sylindriske trykksonderingsstenger
    ned i grunnen med konstant hastighet, brukes for å bestemme lagdeling og jordart
    i løsmasser, samt mekaniske egenskaper for jorden<engelsk>penetration of a probe
    at the end of a series with cylindrical rods into the ground at the constant rate
    of penetration, used to determine stratification and soil type, together with
    mechanical properties of the soil</engelsk>
  customProperties:
  - property: sosiObjektType
    value: Trykksondering
  - property: inheritsFrom
    value: GeotekniskInsituTest
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO for Norge.'
      required: true
    - name: versjonId
      logicalType: string
      description: 'identifikasjon av en spesiell versjon av et geografisk objekt
        (instans), maksimum lengde på 25 karakterers. Dersom spesifikasjonen av et
        geografisk objekt med en identifikasjon inkludererer livsløpssyklusinformasjon,
        benyttes denne versjonId for å skille mellom ulike versjoner av samme objekt.
        versjonId er en unik  identifikasjon av versjonen.


        NOTE Maksimum lengde er valgt for å tillate tidsregistrering i henhold til  ISO
        8601, slik som  "2007-02-12T12:12:12+05:30" som versjonId.'
    description: unik identifikasjon av et objekt
    required: true
  - name: fraBorlengde
    logicalType: number
    description: lengde målt fra toppen av kurven/linja som beskriver borehullforløpet
      [m] <engelsk>distance measured from the top of  the curve describing the borehole
      geometry</engelsk>
  - name: insituTestSluttTidspunkt
    logicalType: timestamp
    description: tidspunkt for stopp av in situ prøvningen<engelsk>stop time for in
      situ testing</engelsk>
  - name: insituTestStartTidspunkt
    logicalType: timestamp
    description: tidspunkt for start av in situ prøvningen<engelsk>start time for
      in situ testing</engelsk>
  - name: tilBorlengde
    logicalType: number
    description: lengde målt fra toppen av kurven/linja som beskriver borehullforløpet
      [m] <engelsk>distance measured from the top of  the curve describing the borehole
      geometry</engelsk>
  - name: alpha
    logicalType: number
    description: arealforhold for trykksonde for korreksjon av målt spissmotstand
      for poretrykkseffekter<engelsk>area ratio for CPT probe for correction of measured
      cone resistance for pore pressure effects</engelsk>
  - name: atmosferiskTrykkKorreksjon
    logicalType: number
    description: '<engelsk>Gets or sets the atmospheric pressure correction [MPa].

      @value The atmospheric pressure correction.</engelsk>'
  - name: cptKorreksjonsFaktor
    logicalType: number
    description: øvrige faktorer for korreksjon av trykksonderingsdata, for eksempel
      korreksjon av målt sidefriksjon<engelsk>other factors for correction of CPT
      data, for example correction of measured sleeve friction</engelsk>
  - name: filterType
    logicalType: string
    description: type filter for måling av poretrykk (porøst filter, ferdigmettet,
      spaltefilter)<engelsk>type of filter for measurement of pore pressure (porous
      filter, pre-saturated filter, slot filter)</engelsk>
  - name: hylseRadieKorreksjon
    logicalType: number
    description: '<engelsk>Gets or sets the sleeve distance correction [m].

      @value The sleeve distance correction.</engelsk>'
  - name: initiellSpissmotstand
    logicalType: number
    description: referanseverdi for spissmotstand ved start av måling (eksempel ved
      start dissipasjonstest) [MPa] <engelsk>reference value cone resistance at the
      start of the test (e.g. at the start of a dissipation test)</engelsk>
  - name: metningsMedium
    logicalType: string
    description: medium som benyttes for metting av målesystem for poretrykk<engelsk>medium
      used for saturation of measuring system for pore pressure</engelsk>
  - name: nedpressingsKapasitet
    logicalType: string
    logicalTypeOptions:
      pattern: ^(10\ kN|100\ kN|50\ kN)$
    customProperties:
    - property: allowedValues
      value:
      - value: 10 kN
        label: trykksonde med lastkapasitet 1 tonn <engelsk>probe with vertical load
          capacity 1 ton</engelsk>
      - value: 100 kN
        label: trykksonde med lastkapasitet 10 tonn <engelsk>probe with vertical load
          capacity 10 tons</engelsk>
      - value: 50 kN
        label: trykksonde med lastkapasitet 5 tonn <engelsk>probe with vertical load
          capacity 5 tons</engelsk>
    description: kapasitet for anvendt nedpressingsutstyr [kN] <engelsk>capacity for
      applied thrust machine</engelsk>
  - name: nedpressningsHastighet
    logicalType: number
    description: nedpressingshastighet ved penetrasjon av trykksonderingsstenger (standard
      er 20 mm/s ± 5 mm/s) [mm/s] <engelsk>rate of penetration for rod system (standard
      is 20 mm/s ± 5 mm/s)</engelsk>
  - name: nullpunktsKorreksjon
    logicalType: number
    description: korreksjon for registrert nullpunktsavvik før og etter sondering
      <engelsk>correction for recorded zero load drift before and after sounding</engelsk>
  - name: rørKappeKorreksjonsFaktor
    logicalType: number
    description: korreksjonsfaktor for bruk av friksjonsreduksjonsring <engelsk>correction
      factor for use of friction reducer</engelsk>
  - name: sidefriksjonKorreksjon
    logicalType: number
    description: korreksjon av målt sidefriksjon på grunn av poretrykkseffekter<engelsk>correction
      of measured sleeve friction due to pore pressure effects</engelsk>
  - name: sondeIdentifikasjon
    logicalType: string
    description: identifikasjon av trykksonde ved hjelp av ID-nummer <engelsk>identification
      of probe by an ID-number</engelsk>
  - name: sondeKalibreringDato
    logicalType: timestamp
    description: dato for kalibrering av trykksonde, oppgis på kalibreringssertifikat<engelsk>date
      for calibration of probe, given on the calibration certificate</engelsk>
  - name: sondeKvalitetKlasse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Klasse\ 1|Klasse\ 2|Klasse\ 3|Klasse\ 4)$
    customProperties:
    - property: allowedValues
      value:
      - value: Klasse 1
        label: anvendelsesklasse 1 for CPTU med høyeste krav til målenøyaktighet<engelsk>application
          Class 1 for CPTU with the highest accuracy</engelsk>
      - value: Klasse 2
        label: anvendelsesklasse 2 for CPT/CPTU <engelsk>application Class 2 for CPT/CPTU</engelsk>
      - value: Klasse 3
        label: anvendelsesklasse 3 for CPT/CPTU <engelsk>application Class 3 for CPT/CPTU</engelsk>
      - value: Klasse 4
        label: anvendelsesklasse 4 for CPT med laveste krav til målenøyaktighet<engelsk>application
          Class 4 for CPT with the lowest accuracy.</engelsk>
    description: kvalitetsklasse for målenøyaktighet for en trykksonde ved gjennomføring
      av anbefalt prøvingsprosedyre <engelsk>application class for test accuracy for
      test performance according to a recommended test procedure</engelsk>
  - name: spissKorreksjonFaktor
    logicalType: number
    description: korreksjonsfaktor for trykksonde ved korreksjon av målt spissmotstand
      for poretrykkseffekter<engelsk>correction factor for measured cone resistance
      for pore pressure effects</engelsk>
  - name: spissType
    logicalType: string
    description: type trykksonde, avhengig av størrelse og instrumentering<engelsk>type
      of probe, depending on size and instrumentation</engelsk>
