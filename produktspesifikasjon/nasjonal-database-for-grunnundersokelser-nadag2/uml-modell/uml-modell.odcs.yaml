      - value: Ikke angitt
        label: informasjon mangler <engelsk>not specified</engelsk>
      - value: Lukket
        label: lukket (avskjermet) grunnvannsmagasin<engelsk>closed (protected) aquifer</engelsk>
      - value: Utett
        label: utett (drenert) grunnvannsmagasin<engelsk>drained aquifer</engelsk>
      - value: Åpen
        label: åpent grunnvannsmagasin<engelsk>open aquifer</engelsk>
    description: 'type og størrelse av grunnvannsreservoir<engelsk>

