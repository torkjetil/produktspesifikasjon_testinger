      - value: Polygon hentet  fra borehull i GU, min og  maks koordinater.
        label: Polygon hentet  fra borehull i GU, min og  maks koordinater.
      - value: Polygon som avgrenser borehull i GU.
        label: Avgrensning av en geoteknisk undersøkelse som i hovedsak avgrenser
