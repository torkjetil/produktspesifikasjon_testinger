    description: 'forklaring av hva som er utført og/eller observert i denne undersøkelsen


      <engelsk>

      a general description of actions performed and/or observed in this investigation

      </engelsk>'
  - name: borehullForløp
    logicalType: string
    description: 'detaljert beskrivelse av borhullets geometri, dvs. et en-dimensjonalt
      referansesystem nedover i senterlinjen av borehullet


      <engelsk>

      detailed description of the borehole geometry, i.e. a one-dimensional reference
      system along the borehole centerline

      </engelsk>'
  - name: boretAzimuth
    logicalType: number
    description: 'vinkelen mellom en referansevektor i et referanseplan og en annen
      vektor i det samme planet som peker mot noe av interesse [°]


      <engelsk>

      The vector from an observer (origin) to a point of interest is projected perpendicularly
      onto a reference plane, the angle between the projected vector and the reference
      vector on the reference plane is called the azimuth

      </engelsk>'
  - name: boretHelningsgrad
    logicalType: number
    description: 'helning hvor 90 grader er vertikalt, 0 grader er horisontalt [°]


      <engelsk>

      the inclination of the borehole


      Note: 90 degrees represent the vertical inclination and 0 degrees the horizontal

      </engelsk>'
  - name: boretLengde
    logicalType: number
    description: 'total lengde av borehullets forløp, tilsvarer dyp ved vertikal boring
      [m]


      <engelsk>

      total length of the investigation in the physical borehole, the same as depth
      in a vertical borehole

      </engelsk>'
  - name: boretLengdeTilBerg
    logicalType: object
    properties:
    - name: borlengdeKvalitet
      logicalType: string
      logicalTypeOptions:
        pattern: ^(antatt|påvist)$
      customProperties:
      - property: allowedValues
        value:
        - value: antatt
          label: 'usikker angivelse av dybde til berg


            <engelsk>

            uncertain depth to rock

            </engelsk>'
        - value: påvist
          label: 'sikker angivelse av dybde til berg


            <engelsk>

            confirmed depth to rock

            </engelsk>'
      description: 'beskriver om dybden til berg er antatt eller påvist med en sikker
        metode


        <engelsk>

        defines the quality of the depth information either assumed or confirmed by
        a secure method

        </engelsk>'
      required: true
    - name: borlengdeTilBerg
      logicalType: number
      description: 'dybde til fjell som ikke er målt men basert på tolkning [m]


        <engelsk>

        depth to bedrock based on interpretation

        </engelsk>'
      required: true
    description: 'dybde til fjell som ikke er målt men basert på tolkning


      <engelsk>

      depth to bedrock based on interpretation

      </engelsk>'
  - name: dybdeFraGittPosisjon
    logicalType: number
    description: 'avstanden fra måleutstyret og ned til det punkt på jordoverflaten
      hvor boring/måling faktisk starter [m]


      Merknad: Borehullundersøkelsens posisjon er vanligvis angitt med x,y,z-koordinat.
      Disse verdiene representerer vanligvis et punkt på jordoverflaten. Dybden fra
      denne gitte posisjon vil da være 0. Hvis boringen derimot er utført fra flåte,  skip
      eller is, er det viktig at dybdeFraGittPosisjon blir angitt. Denne vil da være
      avstanden fra måleutstyrets senter (0 dybde) og ned til havbunnen, innsjøbunnen
      eller elvebunnen hvor sonderingen/boringen faktisk starter fra).


      <engelsk>

      distance from the drill or measure equipment down to the vertical level where
      the borehole/measurement actually begins


      Note: This is important to specify if the drilling/sounding is performed from
      e.g. a raft, ship or from ice. The depth will then be the depth from the measuring
      equipments origin (0 depth) and down to where drilling/sounding actually begins
      (on the sea surface, bottom of a lake or river, etc.)


      </engelsk>'
  - name: dybdeFraVannoverflaten
    logicalType: number
    description: 'den lengden hvor sonderingsutstyret befinner seg i vann [m]


      Merknad: Av spesiell interesse hvis boring er utført fra is eller fra flåte/skip.


      <engelsk>

      free water depth at the location of the sounding [m]


      Note: Of special interest if drilling is performed from raft or ice.

      </engelsk>'
  - name: lenkeTilTileggsinfo
    logicalType: string
    description: 'lenke til hvor en finner tilleggsinformasjon om borehullsundersøkelsen


      Merknad: URL/URI for aktuelt dokument, bilde, video etc.


      <engelsk>

      link to extra information about the borehole investigation

      Note: URL/URI for the particular document, picture, video

      </engelsk>'
  - name: opphav
    logicalType: string
    description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


      Merknad:

      Kan også beskrive navn på person og årsak til oppdatering


      <engelsk>

      reference to copyright, source, organization/publication source


      Note: May also include name of person and cause of update


      </engelsk>'
  - name: posisjon
    logicalType: string
    description: 'objektets utstrekning gitt i x,y,z.


      Merknad: Den virkelige posisjonen til denne borehullsundersøkelsen.


      <engelsk>

      The position of the investigation, determined by its x,y and z.


      Note: The origin (coordinate system/projection) of the position must be specified.

      </engelsk>'
    required: true
  - name: undersøkelseSlutt
    logicalType: timestamp
    description: 'tidspunkt for stopp av undersøkelsen

      <engelsk>

      end time/date for the investigation

      </engelsk>'
  - name: undersøkelseStart
    logicalType: timestamp
    description: 'tidspunkt for start av undersøkelsen

      <engelsk>

      start time/date for the investigation

      </engelsk>'
  - name: værforholdVedBoring
    logicalType: string
    description: 'beskrivelse av værforhold under utførelsen av borehullundersøkelsen

      <engelsk>

      Weather conditions - general description.

      </engelsk>'
  - name: dybdeGrunnvannstand
    logicalType: number
    description: dybde [m] fra terrengoverflaten til det nivå i grunnen der alle porene
      i jorden er mettet med vann og poretrykket begynner å stige <engelsk>depth [m]
      from the terrain surface to the level in the ground where all voids are saturated
