      - value: Polygon som representerer prosjektområde.
        label: Avgrensning av en geoteknisk undersøkelse som representerer prosjektområde.
      - value: Representasjonspunkt for kommunalt/regionalt GU-område.
        label: Avgrensning av en geoteknisk undersøkelse basert på et representasjonspunkt.
