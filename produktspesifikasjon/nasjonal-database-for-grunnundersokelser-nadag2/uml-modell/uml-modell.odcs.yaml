- name: KannePrøve
  physicalName: kannepr_ve
  logicalType: object
  physicalType: table
  description: 'omrørt fysisk prøvemateriale tatt i organiske materialer eller bløte
    leirer med enkelt håndoperert utstyr


    <engelsk>disturbed physical soil sample taken from organic material or soft clays
    with simple hand operated equipment</engelsk>'
  customProperties:
  - property: sosiObjektType
    value: KannePrøve
  - property: inheritsFrom
    value: GeotekniskPrøvetaking
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO for Norge.'
      required: true
    - name: versjonId
      logicalType: string
      description: 'identifikasjon av en spesiell versjon av et geografisk objekt
        (instans), maksimum lengde på 25 karakterers. Dersom spesifikasjonen av et
        geografisk objekt med en identifikasjon inkludererer livsløpssyklusinformasjon,
        benyttes denne versjonId for å skille mellom ulike versjoner av samme objekt.
        versjonId er en unik  identifikasjon av versjonen.


        NOTE Maksimum lengde er valgt for å tillate tidsregistrering i henhold til  ISO
        8601, slik som  "2007-02-12T12:12:12+05:30" som versjonId.'
    description: unik identifikasjon av et objekt
    required: true
  - name: densitetPrøvetaking
    logicalType: number
    description: vekt pr. volumenhet [kg/m3] <engelsk>weight by unit of space (kg/m3)</engelsk>
  - name: fraBorlengde
    logicalType: number
    description: lengde målt fra toppen av kurven/linja som beskriver borehullforløpet
      [m] <engelsk>distance measured from the top of  the curve describing the borehole
      geometry</engelsk>
  - name: miljøtekniskUndersøkelse
    logicalType: string
    description: beskrivelse og resultater fra miljøteknisk undersøkelse <engelsk>description
      and results from environmental investigation<engelsk>
  - name: prøvetype
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Blokk|Plastrør|Poseprøve|Ren\ flaske|Steril\ flaske|Sylinder)$
    customProperties:
    - property: allowedValues
      value:
      - value: Blokk
        label: blokkprøve, normalt med uforstyrret eller noe forstyrret prøvemateriale<engelsk>block
          sample, normally of undisturbed or slightly disturbed quality</engelsk>
      - value: Plastrør
        label: plastrør<engelsk>plastic tube>
      - value: Poseprøve
        label: poseprøve, normalt med omrørt eller meget forstyrret materiale<engelsk>bag
          sample, normally of remoulded or very disturbed quality</engelsk>
      - value: Ren flaske
        label: ren  flaske <engelsk>clean bottle</engelsk>
      - value: Steril flaske
        label: steril flaske <engelsk>antiseptic bottle</engelsk>
      - value: Sylinder
        label: sylinder, normalt med lett forstyrret til meget forstyrret materiale<engelsk>cylinder,
          normally of slightly to somewhat disturbed quality</engelsk>
    description: klassifisering av fysisk prøvemateriale, avhengig av type prøvetaking
      og jordart<engelsk>classification of sampled material, depending on type of
      sampling and soil type</engelsk>
  - name: tilBorlengde
    logicalType: number
    description: lengde målt fra toppen av kurven/linja som beskriver borehullforløpet
      [m] <engelsk>distance measured from the top of  the curve describing the borehole
      geometry</engelsk>
